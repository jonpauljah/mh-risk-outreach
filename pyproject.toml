[project]
name = "mh-risk-outreach"
version = "0.1.0"
description = "This project develops a prototype mental health outreach decision-support system that uses ETL and SQL to process member data, apply machine-learning risk scoring with rule-based safety overrides, prioritize higher-risk patients, recommend outreach actions, and record short-term outreach outcomes."
readme = "README.md"
authors = [
    { name = "jonpauljah" },
    { name = "ahmed-spx" },
    { name = "kevin2026-ksu" },
    { name = "netEdwards" },
    { name = "spham14" },
    { name = "Wjudge26" },
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "streamlit>=1.64.0",
    "xgboost>=2.1",
]

[project.scripts]
mh-risk-outreach = "mh_risk_outreach:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "prek>=0.5.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff.lint]
extend-select = ["I"]

[[tool.mypy.overrides]]
# scikit-learn ships no type information.
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# xgboost ships no type information. Used by the XGBoost model (#24).
module = ["xgboost.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# joblib ships no py.typed marker. Used to save/load the trained model (#15).
module = ["joblib.*"]
ignore_missing_imports = true
